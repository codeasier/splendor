<html lang="zh-CN">

<meta charset="utf-8">

<title>璀璨宝石 · 横屏牌桌预览</title>
<style>

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #1c0e16;
  color: #f6ead8;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
}
#frame {
  position: absolute;
  left: 0;
  top: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}
#host, #host * { box-sizing: border-box; }
#host { width: 100%; height: 100%; }
/* 竖屏手机框：把整个横屏画布顺时针旋转 90° 并交换宽高，精确铺满容器。
   用 transform-origin: top left + rotate/translate 组合，避免 translate(-50%,-50%)
   的百分比基准在旋转坐标系下产生偏移。 */
@media (orientation: portrait) {
  #frame {
    width: 100vh;
    height: 100vw;
    left: 0;
    top: 0;
    transform-origin: top left;
    transform: rotate(90deg) translate(0, -100%);
  }
}

page {
    width: 100%;
    height: 100%;
    background: #1c0e16;
    color: #f6ead8;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
}

view,
text,
image {
    box-sizing: border-box;
}

/* 璀璨宝石 · 牌桌样式（设计舞台 1080×560，单位 px，随舞台等比缩放）
   美术资源见 art.wxss（由 preview/art.js 生成的矢量插画）。
   所有坐标沿用设计稿，布局逻辑与 index.js 的舞台缩放保持不变。 */

page, .viewport {
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

.viewport {
  position: relative;
  background: radial-gradient(ellipse at 50% 45%, #432636 0%, #25131e 70%, #150a12 100%);
}

.stage {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1080px;
  height: 560px;
  margin-left: -540px;
  margin-top: -280px;
  transform-origin: center center;
  overflow: hidden;
  border-radius: 12px;
  box-shadow: inset 0 0 0 1px rgba(232, 190, 120, .42), inset 0 0 0 5px rgba(18, 8, 15, .5), inset 0 0 0 6px rgba(232, 190, 120, .16);
}

/* ---------- 绒布、织纹、暗角 ---------- */
.felt {
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  background:
    radial-gradient(ellipse 74% 66% at 50% 40%, rgba(184, 102, 132, .34) 0%, rgba(96, 46, 72, .1) 58%, rgba(12, 5, 11, 0) 100%),
    repeating-linear-gradient(45deg, rgba(255, 230, 205, .018) 0px, rgba(255, 230, 205, .018) 1px, transparent 1px, transparent 6px),
    repeating-linear-gradient(-45deg, rgba(0, 0, 0, .055) 0px, rgba(0, 0, 0, .055) 1px, transparent 1px, transparent 6px),
    linear-gradient(158deg, #4e2b3d 0%, #3b2031 42%, #2a1524 74%, #190c17 100%);
}
/* 细密织物经纬 */
.felt::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  background:
    repeating-linear-gradient(0deg, rgba(255, 255, 255, .013) 0px, rgba(255, 255, 255, .013) 1px, transparent 1px, transparent 3px),
    repeating-linear-gradient(90deg, rgba(0, 0, 0, .05) 0px, rgba(0, 0, 0, .05) 1px, transparent 1px, transparent 4px);
  opacity: .85;
}
/* 四边压暗 + 中央柔光 */
.felt::after {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  background:
    radial-gradient(ellipse 58% 52% at 50% 46%, rgba(255, 216, 165, .075) 0%, transparent 100%),
    radial-gradient(ellipse 92% 100% at 50% 50%, transparent 42%, rgba(10, 4, 10, .58) 100%);
  box-shadow: inset 0 0 90px rgba(0, 0, 0, .5);
}

/* 桌垫压印纹章：极低透明度，只提供织物质感，不与牌面争夺注意力 */
.table-emblem {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 440px;
  height: 440px;
  margin-left: -220px;
  margin-top: -220px;
  background-size: 100% 100%;
  background-repeat: no-repeat;
  opacity: .075;
  z-index: 0;
}

/* 四角金色钻饰：不用 L 形断线，避免被顶部/底部面板遮挡后像渲染残缺 */
.corner {
  position: absolute;
  width: 20px;
  height: 20px;
  opacity: .85;
  z-index: 5;
}
.corner-tl { left: 16px; top: 16px; }
.corner-tr { right: 16px; top: 16px; }
.corner-bl { left: 16px; bottom: 16px; }
.corner-br { right: 16px; bottom: 16px; }
.corner::before {
  content: '';
  position: absolute;

.art-10 { background-color: #9e4f55; background-image: linear-gradient(165deg, #b8665c 0%, #f4d3a6 46%, #6a3038 100%); }
.art-11 { background-color: #9e4f55; background-image: linear-gradient(165deg, #8d4149 0%, #e6b18c 46%, #3c1c26 100%); }
.art-12 { background-color: #3d3257; background-image: linear-gradient(165deg, #3d3257 0%, #b9a2bd 46%, #251d34 100%); }

<script>
(function () {
  // 竖屏容器由 CSS 旋转 #frame 承担，逻辑窗口恒为横屏，舞台因此始终按横屏比例缩放。
  function logicalSize() {
    var w = window.innerWidth;
    var h = window.innerHeight;
    return w >= h
      ? { windowWidth: w, windowHeight: h }
      : { windowWidth: h, windowHeight: w };
  }
  window.wx = {
    getWindowInfo: logicalSize,
    getSystemInfoSync: logicalSize,
    showModal: function (o) {
      var ok = window.confirm((o.title || '') + '\n\n' + (o.content || ''));
      if (o.success) o.success({ confirm: ok, cancel: !ok });
      if (o.complete) o.complete();
    },
    showToast: function () {},
    vibrateShort: function () {}
  };

  var cfg = window.__pageConfig;
  if (!cfg) { document.body.innerHTML = '<p style="color:#f6ead8;padding:24px">页面初始化失败：未捕获到 Page 配置</p>'; return; }
  var page = {};
  Object.keys(cfg).forEach(function (k) { page[k] = cfg[k]; });
  page.data = Object.assign({}, cfg.data);

  var host = document.getElementById('host');
  function draw() {
    try { host.innerHTML = window.renderStage(page.data); }
    catch (err) { console.error('[splendor] render failed:', err); }
  }
  page.setData = function (patch) {
    Object.keys(patch).forEach(function (k) { this.data[k] = patch[k]; }, this);
    draw();
  };

  // 事件委托：模拟 bindtap（冒泡）与 catchtap（阻断冒泡）
  host.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== host) {
      var fn = el.getAttribute && el.getAttribute('data-tap');
      var isCatch = false;
      if (!fn && el.getAttribute) {
        fn = el.getAttribute('data-catchtap');
        isCatch = !!fn;
      }
      if (fn && typeof page[fn] === 'function') {
        var ds = {};
        for (var i = 0; i < el.attributes.length; i += 1) {
          var a = el.attributes[i];
          if (a.name.indexOf('data-') === 0 && a.name !== 'data-tap' && a.name !== 'data-catchtap') {
            var key = a.name.slice(5).replace(/-([a-z])/g, function (_, c) { return c.toUpperCase(); });
            ds[key] = a.value;
          }
        }
        page[fn]({ type: 'tap', currentTarget: { dataset: ds }, target: { dataset: ds } });
        if (isCatch) break;
      }
      el = el.parentNode;
    }
  });

  if (page.onLoad) page.onLoad();
  if (page.onShow) page.onShow();
  window.addEventListener('resize', function () { if (page.onResize) page.onResize(); });
  window.addEventListener('orientationchange', function () { if (page.onResize) page.onResize(); });
